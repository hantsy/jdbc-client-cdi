site_name: "Fluent JDBC Client for Jakarta EE/CDI"
site_description: "A lightweight, framework-agnostic fluent JDBC client for Jakarta EE and CDI applications."
repo_url: https://github.com/hantsy/jdbc-client-cdi
repo_name: hantsy/jdbc-client-cdi

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: pink
      accent: pink
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - content.code.copy
    - navigation.expand
    - navigation.indexes
    - search.suggest
  icon:
    repo: fontawesome/brands/git-alt

copyright: Copyright &copy; 2026 Hantsy Bai

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/hantsy

markdown_extensions:
  - meta
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.superfences

plugins:
  - search
  - git-revision-date-localized:
      enable_creation_date: true
      enable_git_follow: false

nav:
  - Introduction: index.md
  - Installation: install.md
  - Quickstart: quickstart.md
  - Dive deeper:
      - Querying and Result mapping: querying.md
      - Updates and generated keys: updates.md
  - Configuration: configuration.md
  - Transactions: transactions.md