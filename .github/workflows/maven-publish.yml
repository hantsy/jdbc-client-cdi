name: Publish package to the Maven Central Repository

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 1.2.3)'
        required: true
        type: string
      next_version:
        description: 'New version for next development iteration (e.g., 1.2.4-SNAPSHOT)'
        required: true
        type: string
        default: '1.0.0-SNAPSHOT'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to push tags
    steps:
      - uses: actions/checkout@v7
      - name: Set up Maven Central Repository
        uses: actions/setup-java@v6
        with:
          java-version: 21
          distribution: temurin
          server-id: central
          server-username-env-var: MAVEN_USERNAME
          server-password-env-var: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.GPG_SIGNING_KEY }}
          gpg-passphrase-env-var: MAVEN_GPG_PASSPHRASE
      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@://github.com"

      - name: Set Maven Version
        run: |
          mvn versions:set -DnewVersion=${{ inputs.version }} -DgenerateBackupPoms=false

      - name: Commit and Tag Version
        run: |
          git add pom.xml
          git commit -m "chore: release version: ${{ inputs.version }}"
          git tag ${{ inputs.version }}
          git push origin master --tags

      - name: Publish package
        run: ./mvnw -P release --batch-mode install -DskipTests
        env:
          MAVEN_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_SIGNING_KEY_PASSWORD }}

      - name: Set New Maven Version For Next Dev Iteration
        run: |
          mvn versions:set -DnewVersion=${{ inputs.next_version }} -DgenerateBackupPoms=false
          git add pom.xml
          git commit -m "chore: prepare next development iteration: ${{ inputs.next_version }}"
          git push origin master