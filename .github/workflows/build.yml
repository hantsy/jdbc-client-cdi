name: Build

on:
  push:
    branches: [ master ]
    paths-ignore:
      - 'docs/**'
      - 'mkdocs.yml'
  pull_request:
    branches: [ master ]
    paths-ignore:
      - 'docs/**'
      - 'mkdocs.yml'

jobs:
  build:
    name: Build on JDK ${{ matrix.java }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: [ '21', '25' ]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v6
        with:
          java-version: ${{ matrix.java }}
          distribution: temurin
          cache: maven

      - name: Build and unit test
        run: mvn -B -ntp install

  format-check:
    name: Format check (jfmt)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: zulu

      - name: Set up ja
        uses: Netflix/ja/.github/actions/setup-ja@v0.22.1

      - name: Resolve dependencies
        run: ./mvnw -B -ntp install -DskipTests

      - name: Check formatting
        run: |
          set -e
          for module in core config cdi integration-tests; do
            ./mvnw -B -ntp -pl "$module" dependency:build-classpath \
              -Dmdep.outputFile=target/jfmt-cp.txt \
              -Dmdep.includeScope=test -q
            cp_file="$module/target/jfmt-cp.txt"
            echo "Checking $module"
            find "$module/src" -name '*.java' -print0 | \
              xargs -0 jfmt --check -cp "$(cat "$cp_file")"
          done

  integration-tests-glassfish:
    name: Integration tests (GlassFish)
    runs-on: ubuntu-latest
    needs: build
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Install modules
        run: mvn -B -ntp install -DskipTests

      - name: Run GlassFish integration tests
        run: mvn -B -ntp -pl integration-tests -Parq-glassfish-managed verify

  integration-tests-wildfly:
    name: Integration tests (WildFly)
    runs-on: ubuntu-latest
    needs: build
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Install modules
        run: mvn -B -ntp install -DskipTests

      - name: Run WildFly integration tests
        run: mvn -B -ntp -pl integration-tests -Parq-wildfly-managed verify
