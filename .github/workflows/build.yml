name: Build

on:
  push:
    branches: [ master ]
    paths-ignore:
      - 'docs/**'
      - 'mkdocs.yml'
  pull_request:
    branches: [ master ]
    paths-ignore:
      - 'docs/**'
      - 'mkdocs.yml'

jobs:
  build:
    name: Build on JDK 25
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'

      # Build everything and install it to the local project target folders.
      # We skip tests here so we can run them in the matrix next.
      - name: Build
        run: mvn clean install -DskipTests

      # Save the compiled targets so the next job can reuse them
      - name: Cache Build Targets
        uses: actions/upload-artifact@v4
        with:
          name: compiled-project-modules
          path: |
            **/target/
            !**/target/maven-archiver/

  # STEP 2: Run tests on a matrix containing both Java 21 and Java 25
  test:
    name: Run Tests on Java ${{ matrix.java-version }}
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java-version: [ '21', '25' ]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Test Runtime Environment
        uses: actions/setup-java@v6
        with:
          java-version: ${{ matrix.java-version }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Download Compiled Targets
        uses: actions/download-artifact@v4
        with:
          name: compiled-project-modules

      # Execute only the tests across all modules (core, config, cdi, tx)
      - name: Run Surefire Test Phase
        run: mvn surefire:test

  integration-tests-glassfish:
    name: Integration tests (GlassFish)
    runs-on: ubuntu-latest
    needs: build
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: temurin
          cache: maven

      - name: Install modules
        run: mvn -B -ntp install -DskipTests

      - name: Run GlassFish integration tests
        run: mvn -B -ntp -pl integration-tests -Parq-glassfish-managed verify

  integration-tests-wildfly:
    name: Integration tests (WildFly)
    runs-on: ubuntu-latest
    needs: build
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: temurin
          cache: maven

      - name: Install modules
        run: mvn -B -ntp install -DskipTests

      - name: Run WildFly integration tests
        run: mvn -B -ntp -pl integration-tests -Parq-wildfly-managed verify
